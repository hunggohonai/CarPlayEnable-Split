name: Build CarPlayEnable Split

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'
          altlist: 'true'
          altlist-src: 'waruhachi/AltList'
          altlist-branch: 'main'

      - name: Clone CarPlayEnable
        run: |
          git clone --depth 1 https://github.com/EthanArbuckle/carplay-cast.git work

      - name: Install split-screen source
        env:
          MM_GZ_B64: ""
          H_GZ_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64, gzip
          mm = gzip.decompress(base64.b64decode(os.environ["MM_GZ_B64"]))
          hh = gzip.decompress(base64.b64decode(os.environ["H_GZ_B64"]))
          Path("work/src/CRCarplayWindow.mm").write_bytes(mm)
          Path("work/src/CRCarplayWindow.h").write_bytes(hh)
          print("mm bytes:", len(mm), "h bytes:", len(hh))
          PY

      - name: Fix modern Clang enum typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/src/CRCarplayWindow.mm")
          s = p.read_text()
          fixes = {
            "traitCollectionWithUserInterfaceIdiom:3": "traitCollectionWithUserInterfaceIdiom:(UIUserInterfaceIdiom)3",
            "traitCollectionWithUserInterfaceStyle:1": "traitCollectionWithUserInterfaceStyle:(UIUserInterfaceStyle)1",
            "UIInterfaceOrientationIsLandscape(snapshotOrientation)": "UIInterfaceOrientationIsLandscape((UIInterfaceOrientation)snapshotOrientation)",
            'UIInterfaceOrientationIsPortrait(objcInvokeT(appSnapshot, @"interfaceOrientation", int))': 'UIInterfaceOrientationIsPortrait((UIInterfaceOrientation)objcInvokeT(appSnapshot, @"interfaceOrientation", int))',
            "UIInterfaceOrientationIsPortrait(self.orientation)": "UIInterfaceOrientationIsPortrait((UIInterfaceOrientation)self.orientation)",
            "UIInterfaceOrientationIsLandscape(self.orientation)": "UIInterfaceOrientationIsLandscape((UIInterfaceOrientation)self.orientation)",
            "UIInterfaceOrientationIsPortrait(desiredOrientation)": "UIInterfaceOrientationIsPortrait((UIInterfaceOrientation)desiredOrientation)",
          }
          for old,new in fixes.items():
              if old not in s:
                  print("warning: not found:", old)
              s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Enable second CarPlay app selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/src/hooks/SpringBoard.xm")
          s = p.read_text()
          start = s.index("        // Dismiss any apps that are already being hosted on Carplay")
          end_marker = "        objc_setAssociatedObject(self, &kPropertyKey_liveCarplayWindow, liveCarplayWindow, OBJC_ASSOCIATION_RETAIN_NONATOMIC);"
          end = s.index(end_marker, start) + len(end_marker)
          new = (
              "        // Normal CarPlayEnable behavior: close the previous hosted app before opening the new one.\n"
              "        id liveCarplayWindow = objcInvoke([UIApplication sharedApplication], @\"liveCarplayWindow\");\n"
              "        if (liveCarplayWindow != nil)\n"
              "        {\n"
              "            objcInvoke(liveCarplayWindow, @\"hardDismiss\");\n"
              "        }\n\n"
              "        liveCarplayWindow = [[CRCarPlayWindow alloc] initWithBundleIdentifier:identifier];\n"
              "        objc_setAssociatedObject(self, &kPropertyKey_liveCarplayWindow, liveCarplayWindow, OBJC_ASSOCIATION_RETAIN_NONATOMIC);"
          )
          p.write_text(s[:start] + new + s[end:])
          PY

      - name: Fix SpringBoard enum typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/src/hooks/SpringBoard.xm")
          s = p.read_text()
          s = s.replace(
              "UIInterfaceOrientationIsLandscape(deviceOrientation)",
              "UIInterfaceOrientationIsLandscape((UIInterfaceOrientation)deviceOrientation)"
          )
          s = s.replace(
              "UIInterfaceOrientationIsLandscape(orientation)",
              "UIInterfaceOrientationIsLandscape((UIInterfaceOrientation)orientation)"
          )
          p.write_text(s)
          PY

      - name: Adjust package metadata and target
        run: |
          cd work
          sed -i '' 's/^Version:.*/Version: 1.0.2-normal1/' control
          sed -i '' 's/^Name:.*/Name: CarPlayEnable Split/' control
          sed -i '' 's/^Description:.*/Description: iOS 14 normal single-app CarPlay mode - fixes app overlay when switching/' control
          sed -i '' 's/^ARCHS = .*/ARCHS = arm64/' Makefile
          sed -i '' 's/^TARGET = .*/TARGET = iphone:clang:14.5:14.0/' Makefile
          sed -i '' 's/^ARCHS = .*/ARCHS = arm64/' carplayenableprefs/Makefile
          sed -i '' 's/^TARGET = .*/TARGET = iphone:clang:14.5:14.0/' carplayenableprefs/Makefile
          cat control
          head -n 3 Makefile

      - name: Build deb
        run: |
          cd work
          make clean
          make package FINALPACKAGE=1

      - name: Collect deb
        run: |
          mkdir -p output
          find work/packages -type f -name '*.deb' -exec cp {} output/ \;
          ls -lh output

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayEnable-Split-iOS14
          path: output/*.deb
          if-no-files-found: error
